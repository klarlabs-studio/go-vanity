apiVersion: v1
kind: Namespace
metadata:
  name: klarlabs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-vanity
  namespace: klarlabs
  labels:
    app: go-vanity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-vanity
  template:
    metadata:
      labels:
        app: go-vanity
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: go-vanity-content
        - name: nginx-conf
          configMap:
            name: go-vanity-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: go-vanity
  namespace: klarlabs
  labels:
    app: go-vanity
spec:
  selector:
    app: go-vanity
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-vanity
  namespace: klarlabs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: go.klarlabs.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-vanity
                port:
                  number: 80
  tls:
    - hosts:
        - go.klarlabs.de
      secretName: go-vanity-tls
